<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>CoffeeConnect | Desk Booking</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header>
			<h1>CoffeeConnect</h1>
			<p>Internal desk booking dashboard</p>
		</header>

		<main>
			<section aria-labelledby="events-heading">
				<h2 id="events-heading">Upcoming Events</h2>
				<article aria-labelledby="event-title">
					<h3 id="event-title">Coffee &amp; Co-working Morning</h3>
					<p>Meet colleagues over coffee and spend the morning working together.</p>
				</article>
			</section>

			<aside aria-labelledby="registration-heading">
				<h2 id="registration-heading">Register</h2>
				<p>Coffee &amp; Co-working Morning</p>
				<form method="post" aria-labelledby="registration-heading">
					<p>
						<label for="first-name">First name (required)</label>
						<input type="text" id="first-name" name="firstName" autocomplete="given-name" required>
					</p>
					<p>
						<label for="last-name">Last name (required)</label>
						<input type="text" id="last-name" name="lastName" autocomplete="family-name" required>
					</p>
					<p>
						<label for="email">Work email (required)</label>
						<input type="email" id="email" name="email" autocomplete="email" required>
					</p>
					<p>
						<label for="location">Location (required)</label>
						<input type="text" id="location" name="location" required>
					</p>
					<p>
						<label for="password">Password (required)</label>
						<input type="password" id="password" name="password" autocomplete="new-password" required>
					</p>
					<button type="submit" disabled title="Registration is not connected yet">Register for event</button>
				</form>
			</aside>
		</main>
	</body>
</html>
